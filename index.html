    summary:`La **célula** es la unidad mínima de vida: la estructura más pequeña capaz de realizar por sí sola todas las funciones vitales (nutrición, relación y reproducción). Todos los seres vivos —desde una bacteria hasta un ser humano— estamos formados por células. El cuerpo humano contiene aproximadamente **37 billones** de células de más de 200 tipos distintos.

Según su complejidad, distinguimos dos grandes grupos. Las **células procariotas** son las más primitivas y sencillas: no tienen núcleo definido, su material genético (ADN) flota libremente en el citoplasma. Las bacterias son el ejemplo más representativo. Las **células eucariotas** son más complejas y evolucionadas: poseen un núcleo verdadero rodeado por una membrana nuclear que protege el ADN. A este grupo pertenecen las células de animales, plantas, hongos y protistas.

Dentro de las eucariotas, distinguimos la **célula animal** y la **célula vegetal**. Ambas comparten estructuras básicas: membrana celular, citoplasma, núcleo, mitocondrias y ribosomas. Sin embargo, la célula vegetal posee tres estructuras exclusivas: la **pared celular** (capa rígida de celulosa que rodea a la membrana y da forma a la célula), los **cloroplastos** (donde se realiza la fotosíntesis gracias a la clorofila) y una gran **vacuola central** que puede ocupar hasta el 90% del volumen celular y almacena agua y sustancias de reserva.

Los **orgánulos** son estructuras especializadas que flotan en el citoplasma y realizan funciones concretas. Los más importantes son: el **núcleo** (centro de control, contiene el ADN con toda la información genética necesaria para fabricar proteínas y reproducirse), las **mitocondrias** (centrales energéticas que producen ATP mediante la respiración celular; cuanto más activa es una célula, más mitocondrias tiene), el **retículo endoplasmático** (sistema de canales para transportar sustancias), el **aparato de Golgi** (empaqueta y envía proteínas a su destino) y los **ribosomas** (fabrican proteínas siguiendo las instrucciones del ADN).

La **membrana celular** es una estructura fundamental presente en todas las células. Está formada por una doble capa de lípidos con proteínas incrustadas, y su función principal es actuar como barrera selectiva: deja entrar los nutrientes que la célula necesita y expulsa los desechos, manteniendo el equilibrio interno de la célula (homeostasis).`,

    infographic:'LivingInfograhic',
    summary:`Un **ser vivo** es todo aquel ser que está formado por células y es capaz de realizar las **tres funciones vitales**: nutrición, relación y reproducción. A diferencia de la materia inerte (una piedra, el agua), los seres vivos se organizan, intercambian materia y energía con el entorno, responden a estímulos y se perpetúan generando descendencia.

La **función de nutrición** consiste en obtener materia y energía del entorno para construir las propias estructuras, crecer y mantenerse vivos. Según cómo obtienen esa energía, los seres vivos se dividen en dos grandes grupos: los **autótrofos** (como las plantas y las algas), que fabrican su propio alimento a partir de sustancias inorgánicas usando la energía del sol mediante la fotosíntesis, y los **heterótrofos** (como los animales, hongos y muchas bacterias), que deben alimentarse de otros seres vivos o de materia orgánica ya fabricada.

La **función de relación** permite a los seres vivos captar información del medio (estímulos como la luz, el calor, los sonidos, el tacto) y responder a ella. En los animales esta función la realiza el sistema nervioso. En las plantas, aunque no tienen nervios, también responden a los estímulos: crecen hacia la luz (fototropismo), sus raíces crecen hacia el agua (hidrotropismo) o cierran sus flores por la noche.

La **función de reproducción** garantiza la continuidad de la especie. Existen dos tipos: la **reproducción sexual** (intervienen dos progenitores y hay intercambio de material genético, lo que genera variabilidad) y la **reproducción asexual** (un solo individuo origina descendientes idénticos a él, como en la división bacteriana o los esquejes de plantas).

Para clasificar la enorme diversidad de seres vivos, los científicos los agrupan en **5 reinos**. El **reino Moneras** incluye a las bacterias, los organismos más primitivos: procariotas, unicelulares, sin núcleo definido. El **reino Protistas** agrupa a organismos eucariotas unicelulares o pluricelulares simples, como las amebas o las algas unicelulares. El **reino Fungi** reúne a los hongos: eucariotas, heterótrofos (se alimentan absorbiendo materia orgánica), con pared celular de quitina. El **reino Vegetal** engloba a las plantas: eucariotas, pluricelulares, autótrofas, con pared celular de celulosa. El **reino Animal** agrupa a los animales: eucariotas, pluricelulares, heterótrofos, capaces de moverse libremente.

Mención especial merecen los **virus**: no se consideran seres vivos porque no tienen estructura celular propia y solo pueden reproducirse dentro de una célula huésped. Son parásitos intracelulares obligatorios.`,

    infographic:'EcoInfograhic',
    summary:`Un **ecosistema** es el sistema natural formado por el conjunto de seres vivos que habitan en un lugar (**biocenosis**) y el medio físico que los rodea (**biotopo**), junto con todas las interacciones que se establecen entre ellos. Un bosque, un lago, un arrecife de coral o incluso un charco son ejemplos de ecosistemas.

El **biotopo** es el componente no vivo (abiótico) del ecosistema: incluye factores como la temperatura, la humedad, la cantidad de luz solar, el tipo de suelo, la salinidad del agua o la altitud. Estos factores determinan qué seres vivos pueden vivir en ese lugar. La **biocenosis** es el componente vivo (biótico): la comunidad de todos los seres vivos que habitan ese biotopo, desde las bacterias del suelo hasta los grandes depredadores.

Dentro de la biocenosis, cada especie ocupa un **hábitat** (el lugar físico concreto donde vive) y un **nicho ecológico** (el papel que desempeña en el ecosistema: qué come, de qué es comido, cómo se relaciona con otros). Dos especies con el mismo nicho ecológico compiten entre sí.

Las relaciones de alimentación se organizan en **cadenas tróficas**, que representan el flujo de materia y energía desde los productores hasta los grandes depredadores. En ellas distinguimos cuatro niveles. Los **productores** (plantas, algas) son el primer eslabón: fabrican materia orgánica a partir de materia inorgánica usando la energía solar. Los **consumidores primarios** (herbívoros: conejos, vacas, orugas) se alimentan directamente de los productores. Los **consumidores secundarios** (carnívoros de primer orden: zorros, ranas, arañas) comen a los herbívoros. Los **consumidores terciarios** (grandes carnívoros: águilas, tiburones, leones) están en lo alto de la cadena. Por último, los **descomponedores** (hongos y bacterias) degradan la materia orgánica muerta y devuelven los nutrientes al suelo, cerrando el ciclo.

La **energía** entra en el ecosistema a través del sol y fluye en una sola dirección: de los productores hacia los consumidores. En cada nivel trófico se pierde aproximadamente el **90% de la energía** en forma de calor, por lo que solo el 10% pasa al siguiente nivel. Esto explica por qué las cadenas tróficas raramente superan los 4-5 eslabones y por qué hay muchas más plantas que herbívoros, y muchos más herbívoros que carnívoros (pirámide trófica).

A diferencia de la energía, la **materia sí se recicla** en los ecosistemas a través de los ciclos biogeoquímicos. En el **ciclo del carbono**, las plantas absorben CO₂ del aire durante la fotosíntesis; los animales lo devuelven al respirar; y los descomponedores liberan el carbono de los organismos muertos. En el **ciclo del agua**, el agua se evapora, forma nubes, precipita y vuelve a los seres vivos a través del suelo y los ríos.

Entre los seres vivos de un ecosistema se establecen diversas **relaciones interespecíficas**: el **mutualismo** (ambas especies se benefician, como las flores y las abejas), el **comensalismo** (una se beneficia y la otra no se ve afectada), el **parasitismo** (una se beneficia a expensas de la otra) y la **depredación** (un individuo caza y se come a otro).`,

El **aparato digestivo** transforma los alimentos en nutrientes que la sangre puede transportar y las células aprovechar. El proceso comienza en la **boca**, donde los dientes trituran el alimento y la saliva inicia la digestión del almidón. El bolo alimenticio pasa por la **faringe** y el **esófago** hasta llegar al **estómago**, donde el ácido clorhídrico y las enzimas gástricas continúan la digestión. El **intestino delgado** (unos 6 metros de longitud) es donde se absorben los nutrientes gracias a las vellosidades intestinales, que aumentan enormemente la superficie de absorción. Finalmente, el **intestino grueso** absorbe el agua y forma las heces, que se eliminan por el ano. Órganos como el **hígado** (produce bilis para emulsionar las grasas) y el **páncreas** (produce enzimas digestivas e insulina) son fundamentales en este proceso.

El **aparato respiratorio** se encarga del intercambio gaseoso: introduce oxígeno (O₂) en la sangre y expulsa dióxido de carbono (CO₂). El aire entra por la **nariz** (se filtra, humedece y calienta), pasa por la **faringe**, la **laringe** (donde están las cuerdas vocales) y la **tráquea**, que se divide en dos **bronquios** que entran en cada pulmón. Dentro de los pulmones, los bronquios se ramifican en bronquiolos hasta llegar a los **alvéolos pulmonares**: millones de pequeños sacos rodeados de capilares sanguíneos donde se produce el intercambio de gases por difusión.

El **aparato circulatorio** transporta oxígeno, nutrientes, hormonas y desechos por todo el organismo. El órgano central es el **corazón**, un músculo involuntario que late unas 70 veces por minuto en reposo (más de 100.000 veces al día). La sangre rica en O₂ sale del corazón por las **arterias**, llega a los tejidos a través de los **capilares** y regresa al corazón por las **venas** ya cargada de CO₂. La **circulación pulmonar** lleva la sangre a los pulmones para oxigenarse. La sangre está formada por plasma, **glóbulos rojos** (transportan O₂), **glóbulos blancos** (defienden de infecciones) y **plaquetas** (permiten la coagulación).

El **aparato excretor** elimina los residuos metabólicos del organismo. Los **riñones** filtran la sangre (unos 180 litros al día) y producen orina, que se conduce por los uréteres hasta la vejiga y se expulsa por la uretra. El hígado también tiene función excretora, eliminando sustancias tóxicas. Los pulmones expulsan CO₂ y la piel elimina agua y sales a través del sudor.

El **sistema nervioso** coordina y controla todas las funciones del organismo. Está formado por el **sistema nervioso central** (encéfalo y médula espinal) y el **sistema nervioso periférico** (nervios que conectan el SNC con el resto del cuerpo). La unidad funcional es la **neurona**, célula especializada en transmitir impulsos nerviosos a gran velocidad. El **sistema endocrino** (hormonas) complementa al nervioso regulando funciones a más largo plazo. El **sistema locomotor**, formado por el esqueleto (206 huesos en el adulto) y los músculos, nos permite movernos y da soporte al cuerpo.`,

    summary:`Los seres vivos necesitan constantemente **materia** (para construir y reparar sus estructuras) y **energía** (para realizar todas sus funciones vitales). La forma de obtener ambas cosas divide a los seres vivos en dos grandes grupos: autótrofos y heterótrofos.

Los seres **autótrofos** (principalmente las plantas y las algas) fabrican su propio alimento a partir de sustancias inorgánicas simples. El proceso mediante el cual lo hacen se llama **fotosíntesis**, y es uno de los procesos bioquímicos más importantes de la biosfera. La fotosíntesis ocurre en los **cloroplastos** de las células vegetales, gracias al pigmento verde llamado **clorofila**. La ecuación resumida es: **6CO₂ + 6H₂O + energía luminosa → C₆H₁₂O₆ (glucosa) + 6O₂**. Es decir, la planta absorbe dióxido de carbono del aire y agua del suelo, y usando la energía del sol los transforma en glucosa (que utiliza como alimento) y libera oxígeno como subproducto. Todo el oxígeno que respiramos proviene de la fotosíntesis de plantas y algas. La fotosíntesis también es el punto de entrada de la energía solar en los ecosistemas.

Los seres **heterótrofos** (animales, hongos, muchas bacterias) no pueden fabricar su propio alimento y deben obtener la materia orgánica comiendo a otros seres vivos. Una vez que tienen glucosa y otros nutrientes, todas las células (tanto autótrofas como heterótrofas) obtienen energía utilizable mediante la **respiración celular**, que ocurre en las **mitocondrias**. La ecuación es la inversa de la fotosíntesis: **C₆H₁₂O₆ + 6O₂ → 6CO₂ + 6H₂O + ATP (energía)**. El ATP (adenosín trifosfato) es la "moneda energética" de la célula: la energía almacenada en el ATP se usa para mover músculos, fabricar proteínas, transportar sustancias y cualquier otra actividad celular.

Los alimentos nos aportan los **nutrientes** que el cuerpo necesita. Los **hidratos de carbono** (pan, arroz, pasta, azúcar) son la principal fuente de energía rápida: se digieren y convierten en glucosa. Las **proteínas** (carne, pescado, huevos, legumbres) son los "ladrillos" del cuerpo: se usan para construir y reparar tejidos, fabricar enzimas, hormonas y anticuerpos. Las **grasas o lípidos** (aceite, mantequilla, frutos secos) almacenan energía a largo plazo, protegen órganos y forman las membranas celulares. Las **vitaminas** (frutas, verduras) son moléculas orgánicas que el cuerpo necesita en pequeñas cantidades para regular procesos metabólicos: su carencia causa enfermedades específicas (escorbuto por falta de vitamina C, raquitismo por falta de vitamina D). Los **minerales** (calcio, hierro, fósforo) son sustancias inorgánicas esenciales para el funcionamiento del organismo: el calcio forma los huesos, el hierro es esencial para los glóbulos rojos. El **agua** es el componente mayoritario de los seres vivos (60-70% del cuerpo humano): disuelve sustancias, transporta nutrientes y desechos, participa en reacciones químicas y regula la temperatura corporal.

La **materia se recicla** en los ecosistemas a través de ciclos biogeoquímicos (el ciclo del carbono, del nitrógeno, del agua), mientras que la **energía no se recicla**: fluye en una sola dirección, del sol a los productores y de ahí a los consumidores, perdiéndose en forma de calor en cada nivel trófico.`,

    summary:`La **salud** es, según la definición de la Organización Mundial de la Salud (OMS, 1948), "un estado de completo bienestar físico, mental y social, y no solamente la ausencia de afecciones o enfermedades". Esta definición es importante porque reconoce que la salud va mucho más allá de no estar enfermo: implica también bienestar psicológico y una adecuada integración social.

Cuando algo altera ese equilibrio, se produce una **enfermedad**. Las enfermedades se clasifican en dos grandes grupos. Las **enfermedades infecciosas** están causadas por microorganismos patógenos (agentes capaces de causar daño) que invaden nuestro organismo. Los principales tipos de patógenos son: las **bacterias** (seres vivos procariotas unicelulares; causan tuberculosis, salmonelosis, neumonía bacteriana; se tratan con antibióticos), los **virus** (no son seres vivos, no tienen células propias, necesitan infectar una célula huésped para reproducirse; causan gripe, COVID-19, varicela, sarampión; no responden a los antibióticos), los **hongos** (causan micosis como el pie de atleta o la candidiasis) y los **parásitos** (organismos que viven a expensas del huésped; la malaria, causada por el parásito Plasmodium transmitido por el mosquito Anopheles, es una de las enfermedades más mortales del mundo). Las **enfermedades no infecciosas** no se contagian: incluyen las enfermedades genéticas (alteraciones en el ADN), las crónicas (diabetes, hipertensión), los tumores (cáncer) y las carenciales (por déficit de nutrientes).

Para defenderse de los patógenos, el cuerpo dispone del **sistema inmunitario**, un conjunto de células y moléculas especializadas. La primera barrera es la **inmunidad inespecífica**: la piel, las mucosas, la tos, el estornudo y la fiebre actúan como defensas físicas y químicas no selectivas. Si los patógenos superan esta barrera, entra en juego la **inmunidad específica**: los **linfocitos** (un tipo de glóbulo blanco) reconocen al patógeno y fabrican **anticuerpos**, proteínas con forma de "Y" que se unen específicamente al patógeno y lo neutralizan. Tras superar la enfermedad, el sistema inmune "recuerda" al patógeno y responde mucho más rápido si vuelve a infectarnos (memoria inmunológica).

Las **vacunas** aprovechan este mecanismo: introducen en el organismo una forma inofensiva del patógeno (virus atenuado, virus muerto o fragmentos de sus proteínas) para que el sistema inmune lo "conozca" sin enfermar y fabrique anticuerpos y células de memoria. Así, si el patógeno real nos infecta en el futuro, las defensas ya están preparadas para eliminarlo rápidamente.

Los **antibióticos** son medicamentos que matan bacterias o impiden su reproducción. Es fundamental usarlos correctamente (terminar siempre el tratamiento, nunca automedicarse) porque el uso incorrecto genera **resistencias bacterianas**: bacterias que sobreviven al antibiótico se reproducen y sus descendientes también son resistentes, lo que es un grave problema de salud pública mundial.

La mejor medicina es la **prevención**: una dieta equilibrada y variada, ejercicio físico regular (al menos 60 minutos diarios de actividad moderada), descanso suficiente (8-10 horas en adolescentes), higiene personal (lavado de manos, higiene bucal), no fumar ni consumir alcohol o drogas, y vacunarse según el calendario vacunal. El tabaco es la primera causa de muerte evitable en el mundo, relacionado con más de 20 tipos de cáncer, enfermedades cardiovasculares y respiratorias crónicas.`,
    keypoints:[

/* ═══ CONFETTI ═══ */
function Confetti({active}){
  if(!active)return null;
  const colors=['#74c69d','#ffd60a','#c77dff','#ff8fa3','#90e0ef','#f4a261'];
  return(
    <div style={{position:'fixed',inset:0,pointerEvents:'none',zIndex:1000}}>
      {Array.from({length:30},(_,i)=>(
        <div key={i} style={{
          position:'absolute',top:'-20px',
          left:`${Math.random()*100}%`,
          width:i%3===0?10:7,height:i%3===0?10:7,

    <div style={{

      fontSize:28,fontWeight:900,fontFamily:'Nunito',

/* ═══ QUIZ CARD ═══
   Logic: user selects an option → clicks Comprobar → answer is locked (correct OR wrong)
   → feedback shown immediately → Siguiente button appears → parent advances index.
   One attempt only. Correct/wrong both recorded. No retries.
═══ */
function QuizCard({question,qIndex,total,onAnswer,isAnswered,wasCorrect,chosenIndex,topicColor,onNext,isLast}){
  const [selected,setSelected]=useState(null);
  const [showHint,setShowHint]=useState(false);
  const [checked,setChecked]=useState(isAnswered);

  // When navigating back to an already-answered question, pre-show the locked state
  useEffect(()=>{
    setSelected(isAnswered ? chosenIndex : null);
    setChecked(isAnswered);
    setShowHint(false);
  },[qIndex]);

  const commit=useCallback(()=>{
    if(selected===null||checked)return;
    setChecked(true);
    const ok=selected===question.ans;
    onAnswer(ok, selected); // pass both result and which option was chosen
  },[selected,checked,question,onAnswer]);

  const letters=['A','B','C','D'];
  const locked=checked; // after committing, all buttons are disabled

  return(
    <div style={{animation:'fadeUp .4s ease both'}}>
      {/* Progress bar */}
      <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:18}}>
        <div style={{flex:1,height:6,background:'rgba(0,0,0,0.08)',borderRadius:100,overflow:'hidden'}}>
          <div style={{height:'100%',width:`${(qIndex/total)*100}%`,background:`linear-gradient(90deg,${topicColor},${topicColor}88)`,borderRadius:100,transition:'width .5s'}}/>
        </div>
        <span style={{fontSize:12,fontWeight:800,color:topicColor}}>{qIndex+1}/{total}</span>
      </div>

      <h3 style={{fontSize:'clamp(15px,2.2vw,18px)',fontWeight:800,lineHeight:1.4,marginBottom:18,color:'#1a2e1a'}}>{question.q}</h3>

      {/* Options */}
      <div style={{display:'flex',flexDirection:'column',gap:10,marginBottom:18}}>
        {question.opts.map((opt,i)=>{
          let cls='btn-opt';
          if(locked){
            if(i===question.ans) cls+=' reveal';                        // always green = correct answer
            else if(i===selected&&i!==question.ans) cls+=' wrong';     // red = what user chose wrong
          } else {
            if(selected===i) cls+=' correct'; // just highlight selected (no feedback yet)
          }
          return(
            <button key={i} className={cls}
              disabled={locked}
              onClick={()=>{ if(!locked) setSelected(i); }}>
              <span style={{
                width:28,height:28,borderRadius:'50%',flexShrink:0,
                background: locked
                  ? (i===question.ans ? '#40916c' : i===selected ? '#e63946' : 'rgba(0,0,0,0.06)')
                  : (selected===i ? topicColor : 'rgba(0,0,0,0.06)'),
                color: locked
                  ? (i===question.ans||i===selected ? 'white' : '#6b9e6b')
                  : (selected===i ? 'white' : '#6b9e6b'),
                display:'flex',alignItems:'center',justifyContent:'center',
                fontSize:11,fontWeight:800,transition:'all .2s',
              }}>{letters[i]}</span>
              <span style={{fontSize:14,fontWeight:600}}>{opt}</span>
            </button>
          );
        })}
      </div>

      {/* Feedback banner — shown after committing */}
      {locked&&(
        <div style={{
          display:'flex',alignItems:'center',gap:10,
          background: wasCorrect ? '#d8f3dc' : '#ffe0e6',
          border:`2px solid ${wasCorrect?'#74c69d':'#ff8fa3'}`,
          borderRadius:'var(--r)',padding:'13px 16px',marginBottom:16,
          animation:'pop .4s cubic-bezier(.34,1.56,.64,1)',
          fontSize:14,fontWeight:700,
          color: wasCorrect ? '#1b4332' : '#7f0000',
        }}>
          <span style={{fontSize:22}}>{wasCorrect ? question.reward : '😅'}</span>
          <div>
            <div>{wasCorrect ? '¡Correcto! +10 XP 🎉' : '¡Fallaste esta vez!'}</div>
            {!wasCorrect&&(
              <div style={{fontSize:12,fontWeight:600,marginTop:2,color:'#9b2335'}}>
                Respuesta correcta: <strong>{question.opts[question.ans]}</strong>
              </div>
            )}
          </div>
        </div>
      )}

      {/* Action row */}
      <div style={{display:'flex',gap:10,flexWrap:'wrap',alignItems:'center'}}>
        {!locked&&(
          <button onClick={commit} disabled={selected===null}
            style={{
              fontFamily:'var(--font)',cursor:selected===null?'default':'pointer',
              background:topicColor,color:'white',fontSize:15,fontWeight:800,
              padding:'12px 26px',borderRadius:50,border:'none',
              opacity:selected===null?.4:1,
              boxShadow:`0 4px 16px ${topicColor}44`,
              transition:'all .15s',
            }}>
            Comprobar ✓
          </button>
        )}
        {locked&&(
          <button onClick={onNext}
            style={{
              fontFamily:'var(--font)',cursor:'pointer',
              background: wasCorrect ? topicColor : '#e63946',
              color:'white',fontSize:15,fontWeight:800,
              padding:'12px 26px',borderRadius:50,border:'none',
              boxShadow:`0 4px 16px rgba(0,0,0,0.2)`,
              transition:'all .15s',
              animation:'pop .35s cubic-bezier(.34,1.56,.64,1)',
            }}>
            {isLast ? '🏆 Ver resultados' : 'Siguiente →'}
          </button>
        )}
        <button className="btn-hint" onClick={()=>setShowHint(h=>!h)}>
          {showHint?'Ocultar pista':'💡 Pista'}
        </button>
      </div>

      {showHint&&(
        <div style={{background:'#fff8e6',border:'2px solid rgba(231,176,0,0.3)',borderRadius:'var(--r)',padding:'13px 16px',marginTop:12,fontSize:13,fontWeight:600,color:'#5c3500',lineHeight:1.6,animation:'fadeUp .3s ease'}}>
          💡 {question.hint}
        </div>
      )}
    </div>
  );
}

/* ═══ TOPIC VIEW ═══ */
function TopicView({topic,progress,onBack,onQuizDone,xp,addXp}){
  const [mode,setMode]=useState('learn');
  const [qIndex,setQIndex]=useState(0);
  // answers[i] = { ok: bool, chosen: number }
  const [answers,setAnswers]=useState({});
  const [showConfetti,setShowConfetti]=useState(false);
  const [showXP,setShowXP]=useState(false);
  const [quizDone,setQuizDone]=useState(false);

  const InfoComp=INFOGRAPHICS[topic.infographic];
  const answered=Object.keys(answers).length;
  const correct=Object.values(answers).filter(a=>a&&a.ok).length;
  const total=topic.questions.length;

  // Called by QuizCard when user commits an answer — lock it, give XP if correct
  const handleAnswer=useCallback((ok, chosen)=>{
    if(qIndex in answers) return; // already answered, ignore
    setAnswers(a=>({...a,[qIndex]:{ok,chosen}}));
    if(ok){
      setShowConfetti(true);setShowXP(true);addXp(10);
      setTimeout(()=>{setShowConfetti(false);setShowXP(false)},1500);
    }
  },[qIndex,answers,addXp]);

  // Called by the Siguiente/Ver resultados button inside QuizCard
  const handleNext=useCallback(()=>{
    if(qIndex<total-1){
      setQIndex(q=>q+1);
    } else {
      // Use functional updater to get latest answers for final tally
      setAnswers(currentAnswers=>{
        const finalCorrect=Object.values(currentAnswers).filter(a=>a&&a.ok).length;
        onQuizDone(topic.id, finalCorrect);
        return currentAnswers;
      });
      setQuizDone(true);
    }
  },[qIndex,total,topic.id,onQuizDone]);

  return(
    <div style={{position:'relative',zIndex:1,maxWidth:720,margin:'0 auto',padding:'0 16px 40px'}}>
      <Confetti active={showConfetti}/>
      <XPFloat xp={10} active={showXP}/>

      {/* Back + topic header */}
      <div style={{display:'flex',alignItems:'center',gap:12,marginBottom:16,paddingTop:16}}>
        <button className="btn-soft" style={{padding:'8px 16px',fontSize:13}} onClick={onBack}>← Temas</button>
        <div style={{display:'inline-flex',alignItems:'center',gap:8,background:topic.colorLight,borderRadius:50,padding:'6px 16px',border:`2px solid ${topic.color}33`,fontSize:13,fontWeight:800,color:topic.color}}>
          <span>{topic.emoji}</span><span>{topic.title}</span>
        </div>
      </div>

      {/* Mode tabs */}
      <div style={{display:'flex',gap:8,marginBottom:20}}>
        {[
          {id:'learn',label:'📖 Estudiar'},
          {id:'quiz',label:'🧠 Quiz'},
        ].map(m=>(
          <button key={m.id} onClick={()=>{setMode(m.id);setQuizDone(false)}}
            style={{
              padding:'10px 22px',borderRadius:50,fontSize:14,fontWeight:800,
              background:mode===m.id?topic.color:'rgba(0,0,0,0.06)',
              color:mode===m.id?'white':topic.color,
              border:`2px solid ${mode===m.id?'transparent':topic.color+'33'}`,
              boxShadow:mode===m.id?`0 4px 14px ${topic.color}44`:'none',
            }}>
            {m.label}
          </button>
        ))}
        <div style={{marginLeft:'auto',display:'flex',alignItems:'center',gap:8}}>
          <span style={{fontSize:13,fontWeight:700,color:topic.color}}>{answered}/{total} respondidas</span>
        </div>
      </div>

      {/* ── LEARN MODE ── */}
      {mode==='learn'&&(
        <div style={{animation:'fadeUp .4s ease'}}>
          {/* Infographic card */}
          <div className="card" style={{padding:24,marginBottom:20}}>
            <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:16}}>
              <div style={{width:36,height:36,borderRadius:10,background:topic.gradient,display:'flex',alignItems:'center',justifyContent:'center',fontSize:20}}>{topic.emoji}</div>
              <div>
                <h2 style={{fontFamily:'var(--serif)',fontSize:22,color:'#1a2e1a',fontStyle:'italic'}}>{topic.title}</h2>
                <p style={{fontSize:13,color:'#6b9e6b',fontWeight:600}}>{topic.subtitle}</p>
              </div>
            </div>
            <InfoComp/>
          </div>

          {/* Summary */}
          <div className="card" style={{padding:24,marginBottom:16}}>
            <h3 style={{fontSize:16,fontWeight:900,color:topic.color,marginBottom:12}}>📝 Resumen</h3>
            <p style={{fontSize:14,lineHeight:1.8,color:'#3d6b3d'}}>
              {topic.summary.split('**').map((part,i)=>
                i%2===1?<strong key={i} style={{color:topic.color}}>{part}</strong>:<span key={i}>{part}</span>
              )}
            </p>
          </div>

          {/* Key points */}
          <div className="card" style={{padding:24}}>
            <h3 style={{fontSize:16,fontWeight:900,color:topic.color,marginBottom:14}}>🔑 Conceptos clave</h3>
            <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(200px,1fr))',gap:12}}>
              {topic.keypoints.map((kp,i)=>(
                <div key={i} className="info-cell" style={{borderColor:topic.color+'22'}}>
                  <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:6}}>
                    <span style={{fontSize:20}}>{kp.icon}</span>
                    <span style={{fontSize:13,fontWeight:800,color:topic.color}}>{kp.label}</span>
                  </div>
                  <p style={{fontSize:12,color:'#3d6b3d',lineHeight:1.6}}>{kp.desc}</p>
                </div>
              ))}
            </div>
          </div>

          <button className="btn-main" style={{width:'100%',marginTop:16,fontSize:16,padding:'16px',background:topic.gradient,boxShadow:`0 6px 20px ${topic.color}44`}}
            onClick={()=>setMode('quiz')}>
            ¡Empezar el Quiz! 🧠 →
          </button>
        </div>
      )}

      {/* ── QUIZ MODE ── */}
      {mode==='quiz'&&!quizDone&&(
        <div>
          {/* Q navigator dots */}
          <div style={{display:'flex',gap:6,flexWrap:'wrap',marginBottom:18}}>
            {topic.questions.map((_,i)=>{
              const ans=answers[i];
              return(
                <button key={i} className="nav-dot"
                  onClick={()=>{ if(ans) setQIndex(i); }} // only jump to answered ones
                  style={{
                    width:i===qIndex?24:9,height:9,
                    background:i===qIndex
                      ? topic.color
                      : ans
                        ? (ans.ok ? '#74c69d' : '#ff8fa3')
                        : 'rgba(0,0,0,0.15)',
                    cursor: ans||i===qIndex ? 'pointer' : 'default',
                  }}/>
              );
            })}
          </div>

          <div className="card" style={{padding:'clamp(18px,4vw,32px)'}}>
            <QuizCard
              key={qIndex}
              question={topic.questions[qIndex]}
              qIndex={qIndex}
              total={total}
              onAnswer={handleAnswer}
              isAnswered={qIndex in answers}
              wasCorrect={answers[qIndex]?.ok}
              chosenIndex={answers[qIndex]?.chosen ?? null}
              topicColor={topic.color}
              onNext={handleNext}
              isLast={qIndex===total-1}
            />
          </div>
        </div>
      )}

      {/* ── QUIZ RESULTS ── */}
      {mode==='quiz'&&quizDone&&(
        <div className="card" style={{padding:32,textAlign:'center',animation:'pop .5s cubic-bezier(.34,1.56,.64,1)'}}>
          <div style={{fontSize:64,marginBottom:10}}>
            {correct>=9?'🏆':correct>=7?'🥇':correct>=5?'🥈':correct>=3?'🥉':'📚'}
          </div>
          <h2 style={{fontFamily:'var(--serif)',fontSize:26,marginBottom:6,fontStyle:'italic'}}>
            {correct>=9?'¡Increíble!':correct>=7?'¡Muy bien!':correct>=5?'¡Buen trabajo!':correct>=3?'¡Sigue practicando!':'¡A repasar el tema!'}
          </h2>
          <p style={{fontSize:16,color:'#3d6b3d',marginBottom:6}}>
            Has acertado <strong style={{color:topic.color,fontSize:22}}>{correct}</strong> de <strong>{total}</strong> preguntas
          </p>
          <p style={{fontSize:14,color:'#999',marginBottom:24}}>
            ✅ {correct} correctas &nbsp;·&nbsp; ❌ {total-correct} falladas
          </p>

          {/* Per-question result grid */}
          <div style={{display:'grid',gridTemplateColumns:'repeat(5,1fr)',gap:8,marginBottom:24}}>
            {topic.questions.map((_,i)=>{
              const ans=answers[i];
              const ok=ans?.ok;
              return(
                <button key={i}
                  onClick={()=>{setQuizDone(false);setQIndex(i)}}
                  title={topic.questions[i].q}
                  style={{
                    aspectRatio:'1',borderRadius:10,
                    background:ok?'#d8f3dc':'#ffe0e6',
                    border:`2px solid ${ok?'#74c69d':'#ff8fa3'}`,
                    display:'flex',alignItems:'center',justifyContent:'center',
                    fontSize:18,cursor:'pointer',transition:'transform .15s',
                    fontFamily:'var(--font)',
                  }}
                  onMouseEnter={e=>e.currentTarget.style.transform='scale(1.1)'}
                  onMouseLeave={e=>e.currentTarget.style.transform=''}>
                  {ok?'✅':'❌'}
                </button>
              );
            })}
          </div>
          <p style={{fontSize:12,color:'#aaa',marginBottom:20}}>Pulsa cualquier pregunta para revisarla</p>

          <div style={{display:'flex',gap:12,justifyContent:'center',flexWrap:'wrap'}}>
            <button className="btn-soft"
              onClick={()=>{setAnswers({});setQIndex(0);setQuizDone(false)}}>
              🔄 Repetir quiz
            </button>
            <button style={{
              fontFamily:'var(--font)',cursor:'pointer',border:'none',
              background:topic.gradient,color:'white',fontSize:15,fontWeight:800,
              padding:'13px 26px',borderRadius:50,
              boxShadow:`0 4px 14px ${topic.color}44`,
            }} onClick={onBack}>
              🏠 Volver a temas
            </button>
          </div>
        </div>
      )}
    </div>
  );
}

/* ═══ HOME SCREEN ═══ */
function HomeScreen({onSelect,progress,xp,totalCorrect}){
  const rank=getRank(xp);
  const nextRank=RANKS.find(r=>r.min>xp)||RANKS[RANKS.length-1];
  const pct=nextRank.min>rank.min?Math.min(100,((xp-rank.min)/(nextRank.min-rank.min))*100):100;
  const totalDone=Object.values(progress).reduce((a,b)=>a+b,0);

  return(
    <div style={{position:'relative',zIndex:1,maxWidth:800,margin:'0 auto',padding:'0 16px 48px'}}>
      {/* Header */}
      <div style={{textAlign:'center',paddingTop:32,paddingBottom:20}}>
        <div style={{fontSize:52,marginBottom:8,animation:'float 3s ease-in-out infinite'}}>🧬</div>
        <h1 style={{fontFamily:'var(--serif)',fontSize:'clamp(28px,5vw,42px)',fontWeight:700,fontStyle:'italic',color:'#1a2e1a',marginBottom:4,letterSpacing:'-.5px'}}>
          BioFlow
        </h1>
        <p style={{fontSize:15,color:'#6b9e6b',fontWeight:600,marginBottom:0}}>Biología 1º ESO · Juan Collado</p>
      </div>

      {/* XP / Rank card */}
      <div className="card" style={{padding:20,marginBottom:20,display:'flex',alignItems:'center',gap:16}}>
        <div style={{width:56,height:56,borderRadius:16,background:'linear-gradient(135deg,#2d6a4f,#74c69d)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:26,flexShrink:0}}>
          {rank.label.split(' ')[0]}
        </div>
        <div style={{flex:1}}>
          <div style={{display:'flex',justifyContent:'space-between',marginBottom:4}}>
            <span style={{fontSize:14,fontWeight:900,color:'#1a2e1a'}}>{rank.label}</span>
            <span style={{fontSize:13,fontWeight:700,color:'#40916c'}}>{xp} XP</span>
          </div>
          <div className="xp-bar">
            <div className="xp-fill" style={{width:`${pct}%`}}/>
          </div>
          <div style={{display:'flex',justifyContent:'space-between',marginTop:4}}>
            <span style={{fontSize:11,color:'#6b9e6b'}}>Siguiente: {nextRank.label}</span>
            <span style={{fontSize:11,color:'#6b9e6b'}}>{totalCorrect} respuestas correctas</span>
          </div>
        </div>
      </div>

      {/* Overall progress */}
      <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:10,marginBottom:24}}>
        {[
          {icon:'📚',val:totalDone,label:'Preguntas respondidas',color:'#2d6a4f'},
          {icon:'✅',val:totalCorrect,label:'Respuestas correctas',color:'#0a9396'},
          {icon:'⭐',val:xp,label:'XP ganados',color:'#e76f51'},
        ].map((s,i)=>(
          <div key={i} className="card" style={{padding:14,textAlign:'center'}}>
            <div style={{fontSize:22,marginBottom:4}}>{s.icon}</div>
            <div style={{fontSize:20,fontWeight:900,color:s.color}}>{s.val}</div>
            <div style={{fontSize:11,color:'#6b9e6b',fontWeight:600,lineHeight:1.3}}>{s.label}</div>
          </div>
        ))}
      </div>

      {/* Topic cards grid */}
      <h2 style={{fontFamily:'var(--serif)',fontSize:20,fontStyle:'italic',color:'#1a2e1a',marginBottom:14}}>Elige un tema para estudiar:</h2>
      <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(220px,1fr))',gap:14}}>
        {TOPICS.map((t,i)=>{
          const done=progress[t.id]||0;
          const total=t.questions.length;
          const pct=(done/total)*100;
          return(
            <button key={t.id} onClick={()=>onSelect(t.id)}
              style={{
                background:'rgba(255,255,255,0.88)',
                backdropFilter:'blur(16px)',
                border:'2px solid rgba(255,255,255,0.9)',
                borderRadius:'var(--r-xl)',
                padding:20,textAlign:'left',cursor:'pointer',
                boxShadow:'var(--sh)',
                transition:'all .2s',
                animation:`fadeUp .5s ${i*.07}s ease both`,
              }}
              onMouseEnter={e=>{e.currentTarget.style.transform='translateY(-4px)';e.currentTarget.style.boxShadow='var(--sh-lg)';e.currentTarget.style.borderColor=t.color+'44'}}
              onMouseLeave={e=>{e.currentTarget.style.transform='';e.currentTarget.style.boxShadow='var(--sh)';e.currentTarget.style.borderColor='rgba(255,255,255,0.9)'}}>
              {/* Emoji */}
              <div style={{width:48,height:48,borderRadius:14,background:t.gradient,display:'flex',alignItems:'center',justifyContent:'center',fontSize:26,marginBottom:12,boxShadow:`0 4px 12px ${t.color}33`}}>
                {t.emoji}
              </div>
              {/* Title */}
              <h3 style={{fontFamily:'var(--serif)',fontSize:17,fontStyle:'italic',fontWeight:700,color:'#1a2e1a',marginBottom:3}}>{t.title}</h3>
              <p style={{fontSize:12,color:t.color,fontWeight:700,marginBottom:12}}>{t.subtitle}</p>
              {/* Progress bar */}
              <div style={{height:6,background:'rgba(0,0,0,0.07)',borderRadius:100,overflow:'hidden',marginBottom:6}}>
                <div style={{height:'100%',width:`${pct}%`,background:t.gradient,borderRadius:100,transition:'width .6s'}}/>
              </div>
              <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
                <span style={{fontSize:11,color:'#6b9e6b',fontWeight:700}}>{done}/{total} preguntas</span>
                {done===total&&<span style={{background:t.colorLight,color:t.color,fontSize:11,fontWeight:800,padding:'2px 8px',borderRadius:50}}>✅ Completo</span>}
              </div>
            </button>
          );
        })}
      </div>

      {/* Achievement badges */}
      {xp>=50&&(
        <div className="card" style={{padding:20,marginTop:20}}>
          <h3 style={{fontSize:14,fontWeight:900,color:'#1a2e1a',marginBottom:12}}>🏅 Logros desbloqueados</h3>
          <div style={{display:'flex',gap:8,flexWrap:'wrap'}}>
            {xp>=50&&<span className="badge" style={{background:'#d8f3dc',color:'#2d6a4f'}}>🌱 Primer acierto</span>}
            {xp>=100&&<span className="badge" style={{background:'#caf0f8',color:'#0a9396'}}>🔬 Científico noval</span>}
            {xp>=300&&<span className="badge" style={{background:'#f0d6ff',color:'#7b2d8b'}}>🧬 Biólogo en prácticas</span>}
            {xp>=600&&<span className="badge" style={{background:'#ffddd2',color:'#c05621'}}>🦁 Naturalista</span>}
            {totalCorrect>=30&&<span className="badge" style={{background:'#fff8e6',color:'#8b6000'}}>⭐ 30 respuestas correctas</span>}
            {Object.values(progress).filter(v=>v>=8).length>=3&&<span className="badge" style={{background:'#ffe0e6',color:'#c0392b'}}>🏆 Experto en 3 temas</span>}
          </div>
        </div>
      )}
    </div>
  );
}

/* ═══ APP ═══ */
function App(){
  const [view,setView]=useState('home');
  const [activeTopic,setActiveTopic]=useState(null);
  const [progress,setProgress]=useState(()=>{const s=sessionStorage.getItem('bio_prog');return s?JSON.parse(s):{}});
  const [xp,setXP]=useState(()=>parseInt(sessionStorage.getItem('bio_xp')||'0'));
  const [totalCorrect,setTotalCorrect]=useState(()=>parseInt(sessionStorage.getItem('bio_tc')||'0'));

  useEffect(()=>{sessionStorage.setItem('bio_prog',JSON.stringify(progress))},[progress]);
  useEffect(()=>{sessionStorage.setItem('bio_xp',xp)},[xp]);
  useEffect(()=>{sessionStorage.setItem('bio_tc',totalCorrect)},[totalCorrect]);

  const addXp=useCallback((n)=>{setXP(x=>x+n);setTotalCorrect(t=>t+1)},[]);

  const handleQuizDone=useCallback((topicId,correct)=>{
    setProgress(p=>({...p,[topicId]:Math.max(p[topicId]||0,correct)}));
  },[]);

  const topic=TOPICS.find(t=>t.id===activeTopic);

  return(
    <div style={{minHeight:'100vh',overflowY:'auto',overflowX:'hidden'}}>
      <div className="nature-bg"/>
      {view==='home'&&(
        <HomeScreen
          onSelect={id=>{setActiveTopic(id);setView('topic')}}
          progress={progress} xp={xp} totalCorrect={totalCorrect}/>
      )}
      {view==='topic'&&topic&&(
        <TopicView
          topic={topic}
          progress={progress}
          onBack={()=>setView('home')}
          onQuizDone={handleQuizDone}
          xp={xp} addXp={addXp}/>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
